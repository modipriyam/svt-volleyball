<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suhradam Volleyball Tournament · Season 2 — Overlay</title>
<style>
  /* ===== Broadcast overlay — transparent for OBS Browser Source ===== */
  :root {
    --navy: #123a6b; --navy-deep: #0a2342; --blue: #2f7fd6; --blue-d: #1a55a8;
    --orange: #f47a2b; --orange-d: #d4520f; --red: #e23b2e; --gold: #f5b53d; --ink: #0a2342;
  }
  /* Bundled locally so the overlay looks identical with NO internet at the venue. */
  @font-face { font-family:'Barlow Condensed'; font-weight:600; font-style:normal; font-display:swap;
    src:url('/fonts/barlow-600.woff2') format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:700; font-style:normal; font-display:swap;
    src:url('/fonts/barlow-700.woff2') format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:800; font-style:normal; font-display:swap;
    src:url('/fonts/barlow-800.woff2') format('woff2'); }

  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Anchored bottom-left; scale with ?scale=1.2 in the OBS URL if needed. */
  #wrap { position: fixed; left: 52px; bottom: 52px; transform-origin: bottom left;
    display: flex; align-items: stretch; gap: 0; transform: scale(var(--s, .82));
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.25,1); }
  #wrap.away { opacity: 0; transform: scale(var(--s, .82)) translateY(40px); pointer-events: none; }

  /* Big logo "bug" panel on the left */
  .logopanel { display:flex; align-items:center; justify-content:center; padding: 0 26px; position: relative; overflow: hidden;
    background: linear-gradient(160deg, var(--navy), var(--navy-deep));
    clip-path: polygon(0 0, 100% 0, 100% 100%, 20px 100%);
    box-shadow: 0 10px 26px rgba(0,0,0,.5); }
  /* faint gold glow that gently breathes behind the logo */
  .logopanel::after { content:''; position:absolute; inset:0; z-index:1;
    background: radial-gradient(circle at 50% 46%, rgba(245,181,61,.14), transparent 66%);
    animation: glowPulse 5s ease-in-out infinite; pointer-events:none; }
  @keyframes glowPulse { 0%,100%{ opacity:.35; } 50%{ opacity:.75; } }
  .logopanel img { position: relative; z-index: 2; height: 132px; width: auto; }
  .stack { display: flex; flex-direction: column; justify-content: flex-end; }

  /* ----- Title tab ----- */
  .titlebar { display: flex; align-items: center; gap: 13px; margin-bottom: -2px; margin-left: 0;
    padding: 8px 24px 10px; width: max-content;
    background: linear-gradient(100deg, var(--navy-deep), var(--navy));
    clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
    box-shadow: 0 4px 18px rgba(0,0,0,.45); }
  .titlebar img { height: 38px; width: auto; }
  .titlebar .t-name { color: #fff; font-weight: 800; letter-spacing: .12em; font-size: 17px; text-transform: uppercase; }
  .titlebar .t-name b { color: var(--orange); }
  .titlebar .t-season { color: var(--gold); font-weight: 700; font-size: 13px; letter-spacing: .18em; }
  .titlebar .live { display:flex; align-items:center; gap:6px; margin-left: 8px;
    background: var(--red); color:#fff; font-weight:800; font-size: 12px; letter-spacing:.14em; padding: 2px 9px; border-radius: 3px; }
  .titlebar .live .d { width:7px; height:7px; border-radius:50%; background:#fff; animation: blink 1.1s infinite; }
  .titlebar .live.paused { background: var(--gold); color: var(--ink); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

  /* ----- Main scoreboard bar ----- */
  .bar { display: flex; align-items: stretch; height: 78px;
    filter: drop-shadow(0 10px 26px rgba(0,0,0,.5)); }

  .team { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 24px; min-width: 290px;
    background: linear-gradient(180deg, #143f73, #0b2748); position: relative; }
  .team.left { align-items: flex-start; padding-left: 26px; }
  .team.right { align-items: flex-end; padding-right: 32px;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 100%, 0 100%); }
  /* team-colour accent edge on the inner side */
  .team.left::after  { content:''; position:absolute; right:0; top:0; bottom:0; width:5px; background: var(--blue); }
  .team.right::after { content:''; position:absolute; left:0;  top:0; bottom:0; width:5px; background: var(--orange); }

  .tname { color:#fff; font-weight:800; font-size: 30px; letter-spacing:.02em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; line-height: 1; }
  .subrow { display:flex; align-items:center; gap:12px; }
  .team.right .subrow { flex-direction: row-reverse; }
  .tcap { display:flex; align-items:center; gap:5px; color: var(--gold); font-weight:700; font-size: 15px; letter-spacing:.03em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .tcap:empty { display:none; }

  /* set pips */
  .pips { display:flex; gap:5px; }
  .pip { width: 10px; height: 10px; border-radius:50%; background: rgba(255,255,255,.22);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .pip.on { background: var(--gold); box-shadow: 0 0 8px rgba(245,181,61,.8); }

  /* serving indicator */
  .serve { display:none; align-items:center; gap:6px; color: var(--gold); font-weight:800;
    font-size: 12px; letter-spacing:.12em; }
  .serve.on { display: flex; }
  .serve .ball { width:11px; height:11px; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff, var(--gold)); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.35);opacity:.7} }

  /* score boxes */
  .score { width: 98px; display:flex; align-items:center; justify-content:center; position: relative; overflow: hidden;
    font-weight:800; font-size: 60px; color:#fff; line-height:1;
    text-shadow: 0 3px 12px rgba(0,0,0,.4);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.2), inset 0 -4px 12px rgba(0,0,0,.28); }
  .score.a { background: linear-gradient(180deg, var(--blue), var(--blue-d)); }
  .score.b { background: linear-gradient(180deg, var(--orange), var(--orange-d)); }
  /* slow broadcast "wave" sheen sweeping across each score box */
  .score::after { content:''; position:absolute; top:-25%; left:0; width:55%; height:150%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.22), transparent);
    transform: translateX(-200%) skewX(-12deg); animation: sheen 5.5s ease-in-out infinite; }
  .score.b::after { animation-delay: 2.75s; }
  @keyframes sheen { 0%{ transform: translateX(-200%) skewX(-12deg); } 22%,100%{ transform: translateX(340%) skewX(-12deg); } }
  .score .n { display:inline-block; position: relative; z-index: 1; }
  .score.pop .n { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0%{transform:scale(.45);opacity:.2} 60%{transform:scale(1.18)} 100%{transform:scale(1)} }
  /* point-scored flash */
  .score.scored { animation: scoreFlash .8s ease-out; }
  @keyframes scoreFlash {
    0%   { filter: brightness(1);    box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 0 0 0 rgba(255,255,255,0); }
    18%  { filter: brightness(1.55); box-shadow: 0 0 28px 4px rgba(255,255,255,.55), inset 0 0 34px rgba(255,255,255,.4); }
    100% { filter: brightness(1);    box-shadow: inset 0 2px 0 rgba(255,255,255,.2), inset 0 -4px 12px rgba(0,0,0,.28); }
  }
  .divider { width: 3px; background: rgba(255,255,255,.85); }

  /* set / history strip */
  .strip { margin-top: 6px; margin-left: 0; width: max-content; display:flex; align-items:center; gap:14px;
    background: rgba(11,31,61,.9); color:#cdd9ef; padding: 5px 16px; border-radius: 4px;
    font-size: 14px; font-weight:600; letter-spacing:.06em;
    clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .strip .setno { color: var(--gold); font-weight:800; letter-spacing:.14em; }
  .strip .hist { color:#9fb2d0; }
  .strip .hist b { color:#eef3fb; font-weight:700; }
  .hidden { display:none !important; }

  /* champion graphic */
  #champ { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(var(--s, 1));
    transform-origin: center; transition: opacity .6s ease; }
  #champ.away { opacity: 0; pointer-events: none; }
  .champ-card { text-align:center; padding: 42px 80px 46px; border-radius: 26px;
    background: linear-gradient(160deg, #1c4a8c, #0a2342); border: 2px solid var(--gold);
    box-shadow: 0 30px 90px rgba(0,0,0,.65), 0 0 60px rgba(245,181,61,.25); }
  .champ-trophy { font-size: 96px; line-height:1; filter: drop-shadow(0 0 22px rgba(245,181,61,.7));
    animation: champFloat 2.6s ease-in-out infinite; }
  @keyframes champFloat { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-12px);} }
  .champ-lbl { font-weight:800; color: var(--gold); letter-spacing:.3em; font-size: 26px; text-transform:uppercase; margin-top: 8px; }
  .champ-team { font-weight:800; color:#fff; font-size: 66px; text-transform:uppercase; line-height:1; margin-top: 6px;
    text-shadow: 0 4px 24px rgba(0,0,0,.5); }
  .champ-cap { font-weight:700; color: var(--gold); font-size: 24px; margin-top: 10px; }
  .champ-cap:empty { display:none; }
  .champ-runner { font-weight:800; color:#e7eefb; font-size: 34px; margin-top: 18px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.2); }
  .champ-runner:empty { display:none; border:0; padding:0; }
  /* confetti */
  #champ .confetti { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; border-radius:26px; }
  #champ .confetti i { position:absolute; top:-16px; border-radius:1px; opacity:.95; animation: confFall linear infinite; }
  @keyframes confFall { 0%{ transform: translateY(-30px) rotate(0deg);} 100%{ transform: translateY(560px) rotate(680deg);} }
  .champ-card { position: relative; overflow: hidden; }
  .champ-card > *:not(.confetti) { position: relative; z-index: 1; }
</style>
</head>
<body>
  <div id="wrap" class="away">
   <div class="logopanel">
     <img id="logo" src="/BostonMainLogoFullWhite.png" alt="" onerror="this.parentElement.style.display='none'" />
   </div>
   <div class="stack">
    <div class="titlebar">
      <span class="t-name">Suhradam <b>Volleyball</b> Tournament</span>
      <span class="t-season">★ SEASON 2</span>
      <span class="live" id="liveTag"><span class="d"></span> LIVE</span>
    </div>

    <div class="bar">
      <div class="team left">
        <span class="tname" id="teamA">Team A</span>
        <div class="subrow">
          <div class="pips" id="pipsA"></div>
          <span class="tcap" id="capA"></span>
          <div class="serve" id="serveA"><span class="ball"></span> SERVING</div>
        </div>
      </div>
      <div class="score a" id="scoreA"><span class="n" id="ptsA">0</span></div>
      <div class="divider"></div>
      <div class="score b" id="scoreB"><span class="n" id="ptsB">0</span></div>
      <div class="team right">
        <span class="tname" id="teamB">Team B</span>
        <div class="subrow">
          <div class="pips" id="pipsB"></div>
          <span class="tcap" id="capB"></span>
          <div class="serve" id="serveB"><span class="ball"></span> SERVING</div>
        </div>
      </div>
    </div>

    <div class="strip hidden" id="strip">
      <span class="setno" id="setno">SET 1</span>
      <span class="hist" id="hist"></span>
    </div>
   </div><!-- /stack -->
  </div>

  <!-- champion graphic (closing moment) -->
  <div id="champ" class="away">
    <div class="champ-card">
      <div class="confetti" id="champConfetti2"></div>
      <div class="champ-trophy">🏆</div>
      <div class="champ-lbl">Champions</div>
      <div class="champ-team" id="champTeam">Team</div>
      <div class="champ-cap" id="champCap"></div>
      <div class="champ-runner" id="champRunner2"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

function makeConfetti(el, n) {
  if (!el) return;
  const colors = ['#f5b53d', '#ffffff', '#f26a21', '#2f7fd6', '#db2b1d'];
  let h = '';
  for (let i = 0; i < n; i++) {
    const left = (Math.random() * 100).toFixed(1);
    const w = (8 + Math.random() * 7).toFixed(1);
    const dur = (2.8 + Math.random() * 2.8).toFixed(2);
    const delay = (Math.random() * 4).toFixed(2);
    h += `<i style="left:${left}%;width:${w}px;height:${(w * 1.7).toFixed(1)}px;background:${colors[i % colors.length]};animation-duration:${dur}s;animation-delay:-${delay}s"></i>`;
  }
  el.innerHTML = h;
}
makeConfetti($('champConfetti2'), 30);

// Fixed size (looks good at the standard scoreboard scale). Add ?scale=1.2 in
// the OBS URL to make the whole overlay bigger/smaller if you want.
(function () {
  const m = parseFloat(new URLSearchParams(location.search).get('scale'));
  if (m && m > 0) document.documentElement.style.setProperty('--s', m);
})();

// Which game (slot) this overlay shows: ?game=1 (default) or ?game=2.
const SLOT = parseInt(new URLSearchParams(location.search).get('game'), 10) === 2 ? 2 : 1;

let prevA = null, prevB = null;

function pips(el, won, total) {
  total = Math.max(total || 3, won);
  let html = '';
  for (let i = 0; i < total; i++) html += `<span class="pip${i < won ? ' on' : ''}"></span>`;
  el.innerHTML = html;
}

function popScore(boxEl, oldV, newV) {
  if (oldV !== null && oldV !== newV) {
    boxEl.classList.remove('pop'); void boxEl.offsetWidth; boxEl.classList.add('pop');
  }
}
function flashScore(boxEl) {
  boxEl.classList.remove('scored'); void boxEl.offsetWidth; boxEl.classList.add('scored');
}

function render(s) {
  const wrap = $('wrap');
  const champ = $('champ');
  // Champion graphic takes over the overlay when a champion is declared.
  if (s.champion) {
    const capOf = (name) => { let c = ''; s.fixtures.forEach((f) => { if (f.teamA === name && f.captainA) c = f.captainA; if (f.teamB === name && f.captainB) c = f.captainB; }); return c; };
    $('champTeam').textContent = s.champion;
    const cc = capOf(s.champion);
    $('champCap').textContent = cc ? '👤 ' + cc : '';
    if (s.runnerUp) { const rc = capOf(s.runnerUp); $('champRunner2').textContent = '🥈 Runner-up: ' + s.runnerUp + (rc ? ' (' + rc + ')' : ''); }
    else $('champRunner2').textContent = '';
    champ.classList.remove('away');
    wrap.classList.add('away');
    return;
  }
  champ.classList.add('away');

  const active = (s.games || []).find((g) => g.slot === SLOT);
  if (!active) { wrap.classList.add('away'); prevA = prevB = null; return; }
  wrap.classList.remove('away');

  const live = active.live;
  $('teamA').textContent = active.teamA;
  $('teamB').textContent = active.teamB;
  $('capA').textContent = active.captainA ? '👤 ' + active.captainA : '';
  $('capB').textContent = active.captainB ? '👤 ' + active.captainB : '';

  const incA = prevA !== null && live.pointsA > prevA;
  const incB = prevB !== null && live.pointsB > prevB;
  popScore($('scoreA'), prevA, live.pointsA);
  popScore($('scoreB'), prevB, live.pointsB);
  prevA = live.pointsA; prevB = live.pointsB;
  if (incA) flashScore($('scoreA'));
  if (incB) flashScore($('scoreB'));

  $('ptsA').textContent = live.pointsA;
  $('ptsB').textContent = live.pointsB;
  pips($('pipsA'), live.setsA, live.totalSets);
  pips($('pipsB'), live.setsB, live.totalSets);

  $('serveA').classList.toggle('on', s.showServe && live.serving === 'A');
  $('serveB').classList.toggle('on', s.showServe && live.serving === 'B');

  const tag = $('liveTag');
  if (live.paused) { tag.textContent = 'PAUSED'; tag.className = 'live paused'; }
  else { tag.innerHTML = '<span class="d"></span> LIVE'; tag.className = 'live'; }

  $('setno').textContent = 'SET ' + live.currentSet;
  const hist = (live.setHistory || []).map((x, i) => `S${i + 1} <b>${x[0]}-${x[1]}</b>`).join('&nbsp;&nbsp;');
  $('hist').innerHTML = hist;
}

// Polling is the reliable baseline (works through tunnels that buffer SSE);
// SSE layered on top for instant updates on the local network.
async function poll() { try { const r = await fetch('/api/state'); render(await r.json()); } catch (e) {} }
function connect() {
  poll();
  setInterval(poll, 1000);
}
connect();
</script>
</body>
</html>
